# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# Keybinds, mirrored from Roland's DarkShadow's Shell setup.
#
# Every key below is one he actually uses today. Where his old key ran a
# `rice-*` binary from DarkShadow's Shell (which Hyprlust does not ship), it is
# wired to the Hyprlust script that does the same job, so the muscle memory
# carries over on a fresh install.
#
# Dropped because Hyprlust has no equivalent and the bind would be dead:
#   SUPER+A dashboard, SUPER+X tools, SUPER+ALT+D dashboard,
#   SUPER+ALT+W widget editor.
#
# GENERATED NOTE: .config/hypr-lua/configs/Keybinds.lua is the 0.57+ twin of
# this file. Keep the two in sync.

$mainMod = SUPER

# Default
$scriptsDir = $HOME/.config/hypr/scripts
$configs = $HOME/.config/hypr/configs
# User
$UserConfigs = $HOME/.config/hypr/UserConfigs
$UserScripts = $HOME/.config/hypr/UserScripts

# ---------------------------------------------------------------------------
# Terminal, launcher and session
# ---------------------------------------------------------------------------
# SUPER+Q closes a window, so the terminal opens on SUPER+Return and SUPER+T.
bind = $mainMod, Return, exec, kitty
bind = $mainMod, T, exec, kitty

# rofi launcher (SUPER+R and ALT+Space both, as in the old rice)
bind = $mainMod, R, exec, rofi -show drun -modi drun,filebrowser,window
bind = ALT, Space, exec, rofi -show drun -modi drun,filebrowser,window

# session
bind = $mainMod, L, exec, $scriptsDir/LockScreen.sh
bind = $mainMod, M, exec, $scriptsDir/Wlogout.sh
bind = CTRL ALT, P, exec, $scriptsDir/Wlogout.sh
bind = CTRL ALT, L, exec, $scriptsDir/LockScreen.sh

# ---------------------------------------------------------------------------
# Windows and focus
# ---------------------------------------------------------------------------
bind = $mainMod, Q, killactive
bind = $mainMod, C, killactive
bind = $mainMod, E, exec, thunar
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod SHIFT, V, togglefloating

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Workspaces: SUPER+[0-9] focuses, SUPER+SHIFT+[0-9] moves the window.
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspacesilent, special:magic

# ---------------------------------------------------------------------------
# Shell features (DarkShadow's Shell -> Hyprlust equivalents)
# ---------------------------------------------------------------------------
# SUPER+W  wallpaper picker (was the Quickshell hyprquickpaper menu)
bind = $mainMod, W, exec, $UserScripts/WallpaperSelect.sh
# SUPER+V  clipboard history (was rice-clip; Hyprlust uses cliphist + rofi)
bind = $mainMod, V, exec, $scriptsDir/ClipManager.sh
# SUPER+N  control center (was rice-cc; swaync ships with Hyprlust)
bind = $mainMod, N, exec, swaync-client -t -sw
# SUPER+U  settings (was rice-settings; nwg-look is the GTK/theme tool)
bind = $mainMod, U, exec, nwg-look
# SUPER+slash  every key on one sheet (was rice-keymap show)
bind = $mainMod, slash, exec, $scriptsDir/KeyHints.sh
# SUPER+SHIFT+G  game mode (his gamebar override)
bind = $mainMod SHIFT, G, exec, $scriptsDir/GameMode.sh

# ---------------------------------------------------------------------------
# Screenshots and recording
# ---------------------------------------------------------------------------
bind = , Print, exec, $scriptsDir/ScreenShot.sh --area
bind = SHIFT, Print, exec, $scriptsDir/ScreenShot.sh --now
bind = $mainMod, Print, exec, $scriptsDir/ScreenShot.sh --swappy
bind = $mainMod SHIFT, R, exec, $UserScripts/recorder.sh

# ---------------------------------------------------------------------------
# Media, volume, brightness, microphone
# ---------------------------------------------------------------------------
bindl = , XF86AudioNext, exec, $scriptsDir/MediaCtrl.sh --nxt
bindl = , XF86AudioPrev, exec, $scriptsDir/MediaCtrl.sh --prv
bindl = , XF86AudioPlay, exec, $scriptsDir/MediaCtrl.sh --pause
bindl = , XF86AudioPause, exec, $scriptsDir/MediaCtrl.sh --pause

bindl = , XF86AudioRaiseVolume, exec, $scriptsDir/Volume.sh --inc
bindl = , XF86AudioLowerVolume, exec, $scriptsDir/Volume.sh --dec
bindl = , XF86AudioMute, exec, $scriptsDir/Volume.sh --toggle
bindl = , XF86AudioMicMute, exec, $scriptsDir/Volume.sh --toggle-mic
bindl = ALT, bracketright, exec, $scriptsDir/Volume.sh --inc
bindl = ALT, bracketleft, exec, $scriptsDir/Volume.sh --dec

bindl = , XF86MonBrightnessUp, exec, $scriptsDir/Brightness.sh --inc
bindl = , XF86MonBrightnessDown, exec, $scriptsDir/Brightness.sh --dec

# F-keys for volume, as in his old hyprland.lua
bindl = $mainMod, F12, exec, $scriptsDir/Volume.sh --inc
bindl = $mainMod, F11, exec, $scriptsDir/Volume.sh --dec
bindl = $mainMod, F10, exec, $scriptsDir/Volume.sh --toggle
