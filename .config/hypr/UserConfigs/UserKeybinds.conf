# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# Personal app launchers, mirrored from Roland's DarkShadow's Shell user.lua
# (which is loaded last there and wins over everything else).
#
# GENERATED NOTE: .config/hypr-lua/UserConfigs/UserKeybinds.lua is the 0.57+
# twin of this file. Keep the two in sync.

$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts

# ---------------------------------------------------------------------------
# Apps (mirrors his user.lua)
# ---------------------------------------------------------------------------
# SUPER+B  Chrome with the same Wayland/VA-API flags he uses
bind = $mainMod, B, exec, google-chrome-stable --ozone-platform=wayland --enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,VaapiOnNvidiaGPUs,VaapiIgnoreDriverChecks --disable-features=UseChromeOSDirectVideoDecoder
# SUPER+H  Helium browser
bind = $mainMod, H, exec, helium-browser
# SUPER+G  Chrome (gamebar moved to SUPER+SHIFT+G)
bind = $mainMod, G, exec, google-chrome-stable --ozone-platform=wayland --enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,VaapiOnNvidiaGPUs,VaapiIgnoreDriverChecks --disable-features=UseChromeOSDirectVideoDecoder
# CTRL+SHIFT+Escape  system monitor
bind = CTRL SHIFT, Escape, exec, missioncenter

# ALT+TAB / ALT+SHIFT+TAB  window switcher (cycles instead of rice-taskview)
bind = ALT, tab, cyclenext
bind = ALT SHIFT, tab, cyclenext, prev

# ---------------------------------------------------------------------------
# Hyprlust extras kept on keys he does not use
# ---------------------------------------------------------------------------
bind = $mainMod, D, exec, rofi -show drun -modi drun,filebrowser,window
bind = $mainMod SHIFT, Return, exec, pypr toggle term
bind = $mainMod, Z, exec, pypr zoom
bind = $mainMod SHIFT, I, exec, qs ipc -c hyprlust-music call music toggle
bind = $mainMod ALT, R, exec, $scriptsDir/Refresh.sh
bind = $mainMod ALT, E, exec, $scriptsDir/RofiEmoji.sh
bind = $mainMod ALT, F, exec, hyprctl dispatch workspaceopt allfloat
